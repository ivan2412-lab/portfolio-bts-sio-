<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio BTS SIO SISR</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050a0e;
    --bg2: #080f14;
    --panel: #0a1520;
    --panel2: #0d1c2a;
    --border: #0e3a52;
    --border2: #1a5a7a;
    --accent: #00d4ff;
    --accent2: #00ff88;
    --accent3: #ff6b35;
    --text: #c8e8f5;
    --text2: #7ab8d4;
    --text3: #3a7a9c;
    --glow: 0 0 20px rgba(0,212,255,0.3);
    --glow2: 0 0 20px rgba(0,255,136,0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Rajdhani', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    cursor: none;
  }

  .cursor {
    position: fixed; width: 12px; height: 12px;
    background: var(--accent); border-radius: 50%;
    pointer-events: none; z-index: 9999;
    transform: translate(-50%, -50%); transition: transform 0.1s;
    box-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent);
  }
  .cursor-ring {
    position: fixed; width: 36px; height: 36px;
    border: 1px solid rgba(0,212,255,0.5); border-radius: 50%;
    pointer-events: none; z-index: 9998;
    transform: translate(-50%, -50%); transition: all 0.15s ease;
  }

  body::before {
    content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 4px);
    pointer-events: none; z-index: 9000;
  }
  body::after {
    content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background-image: linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 50px 50px; pointer-events: none; z-index: 0;
  }

  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    background: rgba(5,10,14,0.95); border-bottom: 1px solid var(--border);
    backdrop-filter: blur(10px); padding: 0 2rem; height: 60px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-logo { font-family: 'Orbitron', monospace; font-size: 1.1rem; color: var(--accent); text-shadow: var(--glow); letter-spacing: 2px; }
  .nav-logo span { color: var(--accent2); }
  .nav-links { display: flex; gap: 0; list-style: none; }
  .nav-links a {
    display: block; padding: 0.4rem 0.9rem;
    font-family: 'Share Tech Mono', monospace; font-size: 0.7rem;
    color: var(--text3); text-decoration: none; letter-spacing: 1px;
    border: 1px solid transparent; transition: all 0.2s; text-transform: uppercase;
  }
  .nav-links a:hover { color: var(--accent); border-color: var(--border); text-shadow: var(--glow); background: rgba(0,212,255,0.05); }
  .nav-status { font-family: 'Share Tech Mono', monospace; font-size: 0.65rem; color: var(--accent2); display: flex; align-items: center; gap: 0.5rem; }
  .nav-status::before { content: ''; width: 7px; height: 7px; background: var(--accent2); border-radius: 50%; box-shadow: var(--glow2); animation: blink 2s infinite; }

  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  section { position: relative; z-index: 1; min-height: 100vh; padding: 100px 4rem 4rem; }
  .section-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 3rem; }
  .section-num { font-family: 'Share Tech Mono', monospace; font-size: 0.75rem; color: var(--accent); opacity: 0.6; }
  .section-title { font-family: 'Orbitron', monospace; font-size: 1.8rem; font-weight: 700; color: var(--text); letter-spacing: 3px; text-transform: uppercase; }
  .section-line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--border2), transparent); }

  #accueil { display: flex; flex-direction: column; justify-content: center; padding-top: 60px; min-height: 100vh; position: relative; overflow: hidden; }
  .hero-bg { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 50% at 70% 50%, rgba(0,80,120,0.15) 0%, transparent 70%), radial-gradient(ellipse 40% 40% at 20% 80%, rgba(0,60,90,0.1) 0%, transparent 60%); }
  .hero-content { position: relative; z-index: 2; max-width: 900px; }
  .hero-tag { font-family: 'Share Tech Mono', monospace; font-size: 0.75rem; color: var(--accent2); letter-spacing: 3px; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.8rem; }
  .hero-tag::before { content: '> '; color: var(--accent); }
  .hero-name { font-family: 'Orbitron', monospace; font-size: clamp(2.5rem, 6vw, 5rem); font-weight: 900; line-height: 1; margin-bottom: 0.5rem; color: #fff; text-shadow: 0 0 40px rgba(0,212,255,0.2); }
  .hero-name .highlight { color: var(--accent); text-shadow: var(--glow); }
  .hero-sub { font-family: 'Rajdhani', sans-serif; font-size: clamp(1.2rem, 2.5vw, 1.8rem); color: var(--text2); font-weight: 300; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 2rem; }
  .hero-desc { font-size: 1rem; color: var(--text3); max-width: 500px; line-height: 1.8; margin-bottom: 2.5rem; font-family: 'Share Tech Mono', monospace; }
  .hero-badges { display: flex; gap: 0.8rem; flex-wrap: wrap; margin-bottom: 2.5rem; }
  .badge { padding: 0.3rem 0.9rem; border: 1px solid var(--border2); font-family: 'Share Tech Mono', monospace; font-size: 0.7rem; color: var(--accent); letter-spacing: 1px; background: rgba(0,212,255,0.05); clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%); }
  .hero-cta { display: flex; gap: 1rem; }
  .btn-primary { padding: 0.8rem 2rem; background: transparent; border: 1px solid var(--accent); color: var(--accent); font-family: 'Share Tech Mono', monospace; font-size: 0.8rem; letter-spacing: 2px; text-decoration: none; text-transform: uppercase; cursor: none; transition: all 0.3s; clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%); position: relative; overflow: hidden; }
  .btn-primary::before { content: ''; position: absolute; inset: 0; background: var(--accent); transform: translateX(-100%); transition: transform 0.3s; z-index: -1; }
  .btn-primary:hover::before { transform: translateX(0); }
  .btn-primary:hover { color: var(--bg); }
  .btn-secondary { padding: 0.8rem 2rem; background: transparent; border: 1px solid var(--border2); color: var(--text2); font-family: 'Share Tech Mono', monospace; font-size: 0.8rem; letter-spacing: 2px; text-decoration: none; text-transform: uppercase; cursor: none; transition: all 0.3s; clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%); }
  .btn-secondary:hover { border-color: var(--accent2); color: var(--accent2); }

  .hero-terminal { position: absolute; right: 4rem; top: 50%; transform: translateY(-50%); width: 380px; background: var(--panel); border: 1px solid var(--border); font-family: 'Share Tech Mono', monospace; }
  .terminal-bar { background: var(--panel2); border-bottom: 1px solid var(--border); padding: 0.5rem 1rem; display: flex; align-items: center; gap: 0.5rem; font-size: 0.65rem; color: var(--text3); }
  .t-dot { width: 8px; height: 8px; border-radius: 50%; }
  .t-dot.red { background: #ff5f56; } .t-dot.yellow { background: #ffbd2e; } .t-dot.green { background: #27c93f; }
  .terminal-body { padding: 1rem; font-size: 0.72rem; line-height: 2; color: var(--text2); }
  .t-line { display: flex; gap: 0.5rem; }
  .t-prompt { color: var(--accent2); } .t-cmd { color: var(--accent); }
  .t-out { color: var(--text3); padding-left: 1rem; } .t-val { color: var(--accent2); }
  .t-cursor { display: inline-block; width: 8px; height: 14px; background: var(--accent); animation: blink 1s infinite; vertical-align: middle; }

  #bts { background: linear-gradient(180deg, transparent, rgba(0,30,50,0.3), transparent); }
  .bts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem; }
  .info-card { background: var(--panel); border: 1px solid var(--border); padding: 1.5rem; position: relative; overflow: hidden; transition: border-color 0.3s, transform 0.3s; }
  .info-card::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: var(--accent); box-shadow: var(--glow); }
  .info-card:hover { border-color: var(--border2); transform: translateY(-3px); }
  .card-label { font-family: 'Share Tech Mono', monospace; font-size: 0.65rem; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 0.5rem; opacity: 0.8; }
  .card-value { font-family: 'Orbitron', monospace; font-size: 1rem; color: var(--text); font-weight: 600; }
  .card-sub { font-size: 0.85rem; color: var(--text3); margin-top: 0.3rem; line-height: 1.6; }
  .options-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem; }
  .option-block { background: var(--panel); border: 1px solid var(--border); padding: 1.5rem; position: relative; }
  .option-block.active { border-color: var(--accent); background: rgba(0,212,255,0.05); }
  .option-block.active::after { content: 'VOTRE OPTION'; position: absolute; top: -1px; right: 1rem; background: var(--accent); color: var(--bg); font-family: 'Share Tech Mono', monospace; font-size: 0.6rem; padding: 0.2rem 0.5rem; letter-spacing: 1px; }
  .option-title { font-family: 'Orbitron', monospace; font-size: 1rem; margin-bottom: 0.8rem; }
  .option-block.active .option-title { color: var(--accent); text-shadow: var(--glow); }
  .option-list { list-style: none; font-size: 0.85rem; color: var(--text2); line-height: 2; }
  .option-list li::before { content: '▸ '; color: var(--accent); }

  /* MISSIONS */
  .missions-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
  .mission-card { background: var(--panel); border: 1px solid var(--border); padding: 1.5rem; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; transition: all 0.3s; }
  .mission-card:hover { border-color: var(--accent); transform: translateY(-4px); box-shadow: 0 10px 30px rgba(0,212,255,0.1); }
  .mission-icon { font-size: 2rem; margin-bottom: 1rem; }
  .mission-title { font-family: 'Orbitron', monospace; font-size: 0.85rem; font-weight: 700; color: var(--accent); letter-spacing: 1px; margin-bottom: 0.8rem; text-transform: uppercase; }
  .mission-desc { font-size: 0.9rem; color: var(--text2); line-height: 1.7; margin-bottom: 1rem; }
  .mission-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.8rem; }
  .tag { padding: 0.2rem 0.6rem; border: 1px solid var(--border2); font-family: 'Share Tech Mono', monospace; font-size: 0.6rem; color: var(--text3); letter-spacing: 1px; }
  .mission-num { position: absolute; top: 1rem; right: 1rem; font-family: 'Orbitron', monospace; font-size: 2rem; font-weight: 900; color: rgba(0,212,255,0.06); line-height: 1; }
  .mission-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 1rem; }
  .mission-mode { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.25rem 0.7rem; font-family: 'Share Tech Mono', monospace; font-size: 0.6rem; letter-spacing: 1px; }
  .mission-mode.classe { border: 1px solid var(--accent2); color: var(--accent2); background: rgba(0,255,136,0.05); }
  .mission-mode.seul { border: 1px solid var(--accent3); color: var(--accent3); background: rgba(255,107,53,0.05); }
  .mission-mode::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .ressource-link { padding: 0.3rem 0.7rem; font-size: 0.65rem; text-decoration: none; }

  .veille-layout { display: grid; grid-template-columns: 1fr 2fr; gap: 2rem; }
  .veille-topics { display: flex; flex-direction: column; gap: 0.8rem; }
  .topic-item { background: var(--panel); border: 1px solid var(--border); padding: 1rem 1.2rem; cursor: none; transition: all 0.2s; display: flex; align-items: center; gap: 0.8rem; font-family: 'Share Tech Mono', monospace; font-size: 0.75rem; color: var(--text3); letter-spacing: 1px; }
  .topic-item.active, .topic-item:hover { border-color: var(--accent); color: var(--accent); background: rgba(0,212,255,0.05); }
  .topic-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .veille-content { display: flex; flex-direction: column; gap: 1rem; }
  .article-card { background: var(--panel); border: 1px solid var(--border); padding: 1.2rem 1.5rem; display: flex; gap: 1.5rem; align-items: flex-start; transition: border-color 0.2s; }
  .article-card:hover { border-color: var(--border2); }
  .article-date { font-family: 'Share Tech Mono', monospace; font-size: 0.65rem; color: var(--accent); letter-spacing: 1px; white-space: nowrap; margin-top: 0.3rem; }
  .article-title { font-family: 'Rajdhani', sans-serif; font-size: 1rem; font-weight: 600; color: var(--text); margin-bottom: 0.4rem; }
  .article-excerpt { font-size: 0.85rem; color: var(--text3); line-height: 1.6; }

  .e4-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
  .e4-card { background: var(--panel); border: 1px solid var(--border); padding: 1.5rem; position: relative; overflow: hidden; transition: all 0.3s; }
  .e4-card:hover { border-color: var(--accent2); box-shadow: 0 0 20px rgba(0,255,136,0.1); }
  .e4-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent2), transparent); opacity: 0; transition: opacity 0.3s; }
  .e4-card:hover::before { opacity: 1; }
  .e4-icon { font-size: 1.8rem; margin-bottom: 1rem; }
  .e4-num { font-family: 'Share Tech Mono', monospace; font-size: 0.65rem; color: var(--accent2); letter-spacing: 2px; margin-bottom: 0.4rem; }
  .e4-title { font-family: 'Orbitron', monospace; font-size: 0.85rem; color: var(--text); margin-bottom: 0.8rem; line-height: 1.4; }
  .e4-desc { font-size: 0.85rem; color: var(--text3); line-height: 1.7; margin-bottom: 1rem; }
  .progress-bar { height: 2px; background: var(--border); position: relative; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); box-shadow: 0 0 8px var(--accent2); }
  .progress-label { display: flex; justify-content: space-between; font-family: 'Share Tech Mono', monospace; font-size: 0.6rem; color: var(--text3); margin-bottom: 0.3rem; }

  .ressources-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
  .ressource-group { background: var(--panel); border: 1px solid var(--border); padding: 1.5rem; }
  .group-title { font-family: 'Share Tech Mono', monospace; font-size: 0.7rem; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 1.2rem; padding-bottom: 0.8rem; border-bottom: 1px solid var(--border); }
  .ressource-item { display: flex; align-items: center; gap: 1rem; padding: 0.8rem 0; border-bottom: 1px solid rgba(14,58,82,0.4); text-decoration: none; transition: all 0.2s; cursor: none; }
  .ressource-item:last-child { border-bottom: none; }
  .ressource-item:hover .r-name { color: var(--accent); }
  .r-icon { width: 36px; height: 36px; background: var(--panel2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
  .r-name { font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 0.95rem; color: var(--text); transition: color 0.2s; }
  .r-type { font-family: 'Share Tech Mono', monospace; font-size: 0.6rem; color: var(--text3); letter-spacing: 1px; }
  .r-badge { margin-left: auto; padding: 0.15rem 0.5rem; font-family: 'Share Tech Mono', monospace; font-size: 0.6rem; letter-spacing: 1px; }
  .r-badge.pdf { border: 1px solid var(--accent3); color: var(--accent3); }
  .r-badge.link { border: 1px solid var(--accent2); color: var(--accent2); }
  .r-badge.doc { border: 1px solid var(--accent); color: var(--accent); }

  #contact { min-height: 80vh; }
  .contact-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; }
  .contact-info { display: flex; flex-direction: column; gap: 1.5rem; }
  .contact-item { display: flex; align-items: center; gap: 1rem; background: var(--panel); border: 1px solid var(--border); padding: 1.2rem 1.5rem; transition: border-color 0.2s; }
  .contact-item:hover { border-color: var(--border2); }
  .contact-icon { font-size: 1.4rem; width: 40px; text-align: center; }
  .contact-label { font-family: 'Share Tech Mono', monospace; font-size: 0.65rem; color: var(--text3); letter-spacing: 1px; margin-bottom: 0.2rem; }
  .contact-val { font-family: 'Rajdhani', sans-serif; font-size: 1rem; font-weight: 600; color: var(--text); }
  .contact-form { background: var(--panel); border: 1px solid var(--border); padding: 2rem; }
  .form-row { margin-bottom: 1.2rem; }
  .form-label { font-family: 'Share Tech Mono', monospace; font-size: 0.65rem; color: var(--accent); letter-spacing: 2px; display: block; margin-bottom: 0.4rem; }
  .form-input, .form-textarea { width: 100%; background: var(--bg2); border: 1px solid var(--border); color: var(--text); padding: 0.7rem 1rem; font-family: 'Share Tech Mono', monospace; font-size: 0.8rem; outline: none; transition: border-color 0.2s; }
  .form-input:focus, .form-textarea:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(0,212,255,0.1); }
  .form-textarea { resize: vertical; min-height: 100px; }
  .form-submit { width: 100%; padding: 0.9rem; background: transparent; border: 1px solid var(--accent); color: var(--accent); font-family: 'Share Tech Mono', monospace; font-size: 0.8rem; letter-spacing: 3px; text-transform: uppercase; cursor: none; transition: all 0.3s; position: relative; overflow: hidden; }
  .form-submit::before { content: ''; position: absolute; inset: 0; background: var(--accent); transform: translateY(100%); transition: transform 0.3s; z-index: -1; }
  .form-submit:hover::before { transform: translateY(0); }
  .form-submit:hover { color: var(--bg); }

  footer { position: relative; z-index: 1; border-top: 1px solid var(--border); padding: 1.5rem 4rem; display: flex; justify-content: space-between; align-items: center; font-family: 'Share Tech Mono', monospace; font-size: 0.65rem; color: var(--text3); }

  .reveal
